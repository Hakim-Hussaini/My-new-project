<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styls3.css">
    <title>digital-clock</title>
</head>
<body>
    <div class="digital-clock">
        <ul class="dot-menu">
                <li class="menu-item">
                    <span class="clock-format-text">24-hour format</span>
                    <div class="format-switch-btn" data-format="12"></div>
                </li>
            </ul>
        <div class="time">
            <span class="hours">00</span>
            <span class="dots">:</span>
            <span class="minutes">00</span>

            <div class="right-side">
                <span class="period">PM/AM</span>
                <span class="seconds">00</span>
                </div>
            </div>
            <!--پایان-->

            <!--شروع calender-->
            
                 <div class="calender">
                 <span class="month-name">Mar</span>,
                <span class="day-name">Sunday</span>
                <span class="day-number">6</span>
                <span class="year">2026</span>
                 </div>

                
        </div>
        <script>
        // javascirpt for switch clock format 9

        const formatSwitchBtn = document.querySelector(".format-switch-btn");

        formatSwitchBtn.addEventListener("click", () => {
            formatSwitchBtn.classList.toggle("active");

            var formatValue = formatSwitchBtn.getAttribute("data-format");
             
            if(formatValue === "12"){
                formatSwitchBtn.setAttribute("data-format", "24");
            }
            else{
                formatSwitchBtn.setAttribute("data-format", "12");
            }
        })


        //get current in javascript
        
        
        function clock(){

            var today = new Date();
            
            var hours = today.getHours();
            var minutes = today.getMinutes();
            var seconds = today.getSeconds();
            let period = "AM"  

           // Set the time period(PM/AM)
           if(hours >= 12){
                    period = "PM";
                }

                // set the 12-hour clock format
                 var formatValue = formatSwitchBtn.getAttribute("data-format");
                 if(formatValue === "12"){
                    hours = hours > 12 ? hours % 12 : hours;
                 }
                

                // Add the 0 for the values lower than 10

                if(hours < 10 ){
                    hours = "0" + hours;
                }

                 if(minutes < 10 ){
                    minutes = "0" + minutes;
                }

                 if(seconds < 10 ){
                    seconds = "0" + seconds;
                }

            document.querySelector(".hours").innerHTML = hours;
            document.querySelector(".minutes").innerHTML = minutes;
            document.querySelector(".seconds").innerHTML = seconds ;
            document.querySelector(".period").innerHTML = period;
        
              }

       var updateClock = setInterval(clock, 1000);

       //get the date in javascript 

       var today = new Date();
       const dayNumber = today.getDate();
       const year = today.getFullYear();
       const dayName = today.toLocaleString("default", {weekday: "long"});
       const monthName = today.toLocaleString("default", {month: "short"});


       document.querySelector(".month-name").innerHTML = monthName;
       document.querySelector(".day-name").innerHTML = dayName;
       document.querySelector(".day-number").innerHTML = dayNumber;
       document.querySelector(".year").innerHTML = year;
       
    </script>
    </div>
</body>
</html>
